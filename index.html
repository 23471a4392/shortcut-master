<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHORTCUT MASTER — Keyboard Hotkey Learning Game</title>
  <meta name="description" content="Master real keyboard shortcuts through interactive gameplay, scenario missions, speed trials, and epic boss battles.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f08a'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/boss.css">
</head>
<body>
  <div id="app-root">
    <!-- Main App Navigation Header -->
    <header class="app-header">
      <div class="header-top-row">
        <a class="brand-logo" id="app-brand-logo">
          <span class="logo-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </span>
          <h1 class="brand-title">SHORTCUT <span>MASTER</span></h1>
        </a>

        <!-- Player Quick HUD -->
        <div class="header-hud-strip">
          <div class="hud-pill hud-level-pill" id="hud-player-level" title="Player Level">LVL 1</div>
          <div class="hud-pill hud-xp-pill" id="hud-player-xp" title="Total XP">0 XP</div>
          <div class="hud-pill hud-streak-pill" id="hud-player-streak" title="Active Streak">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 23c4.97 0 9-4.03 9-9 0-4.66-3.26-8.56-7.58-10.45l-.42-.19-.19.42C12.3 4.9 12 6.13 12 7.42c0 1.25.32 2.45.89 3.51l.24.45-.49-.15C10.74 10.65 9 8.71 9 6.38c0-.62.11-1.22.3-1.78l.18-.53-.55.15C5.83 5.09 3.5 8.7 3.5 13c0 5.25 4.03 9.5 9.25 10H12z"/></svg>
            <span id="hud-streak-count">0</span>
          </div>
          <!-- Light / Dark Theme Mode Toggle -->
          <button class="hud-mode-toggle-btn" id="btn-theme-mode-toggle" title="Toggle Light / Dark Mode" aria-label="Toggle Theme Mode">
            <span class="mode-icon-dark">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </span>
            <span class="mode-icon-light">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </span>
            <span id="mode-toggle-label">Dark</span>
          </button>
          <!-- User Profile & Account Dropdown -->
          <div class="hud-user-profile-wrap">
            <button class="hud-user-pill" id="hud-user-btn" title="Player Account" aria-haspopup="true">
              <span class="hud-user-avatar" id="hud-user-avatar-slot">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <span class="hud-user-name" id="hud-user-name-slot">Sign In</span>
              <span class="hud-dropdown-arrow">▼</span>
            </button>
            <div class="user-dropdown-menu" id="user-dropdown-menu">
              <div class="dropdown-user-header">
                <small>Active Operator</small>
                <strong id="dropdown-username">Guest Player</strong>
              </div>
              <button class="dropdown-action-btn" id="btn-switch-account">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                <span>Switch / New Account</span>
              </button>
              <button class="dropdown-action-btn btn-logout" id="btn-hud-logout">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Log Out</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 12 Clean Navigation Tabs with SVG Icons -->
      <nav class="header-nav-scroll" aria-label="Main Navigation">
        <div class="header-nav-tabs">
          <button class="nav-btn active" data-screen="home">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </button>
          <button class="nav-btn" data-screen="learn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Learn</span>
          </button>
          <button class="nav-btn" data-screen="practice">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            <span>Practice</span>
          </button>
          <button class="nav-btn" data-screen="missions">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
            <span>Missions</span>
          </button>
          <button class="nav-btn" data-screen="speed">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/></svg>
            <span>Speed</span>
          </button>
          <button class="nav-btn" data-screen="survival">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Survival</span>
          </button>
          <button class="nav-btn" data-screen="memory">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
            <span>Memory</span>
          </button>
          <button class="nav-btn" data-screen="boss">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg>
            <span>Boss Battles</span>
          </button>
          <button class="nav-btn" data-screen="achievements">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7.5a2.5 2.5 0 0 0-2.5 2.5v.5H19v-.5a2.5 2.5 0 0 0-2.5-2.5H15c-.55 0-1-.45-1-1v-2.34"/><path d="M6 4h12v6c0 3.31-2.69 6-6 6s-6-2.69-6-6V4z"/></svg>
            <span>Achievements</span>
          </button>
          <button class="nav-btn" data-screen="progress">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
            <span>Progress</span>
          </button>
          <button class="nav-btn" data-screen="settings">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
          </button>
          <button class="nav-btn" data-screen="help">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Help</span>
          </button>
        </div>
      </nav>
    </header>

    <!-- Dynamic Screen Content Slot -->
    <main class="app-main-viewport" id="screen-content-container" role="main">
      <!-- Screen content rendered dynamically by JS modules -->
    </main>

    <!-- Interactive On-Screen Keyboard Visualizer Dock -->
    <aside class="keyboard-dock" id="keyboard-visualizer-container" aria-label="Keyboard Visualizer">
      <div class="keyboard-dock-inner">
        <div class="keyboard-header-bar">
          <span class="kb-title-label">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2.5"/><line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/><line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/><line x1="8" y1="16" x2="16" y2="16"/></svg>
            KEYBOARD INPUT DETECTOR
          </span>
          <div class="kb-detected-badge" id="kb-detected-combo">Waiting for keystroke...</div>
        </div>
        <!-- Grid rendered by keyboard.js -->
      </div>
    </aside>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Level-Up Celebration Modal -->
    <div id="level-up-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card level-up-modal-card">
        <div class="modal-icon" id="modal-lvl-icon">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="var(--color-accent)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div class="lvl-number-badge" id="modal-lvl-number">LEVEL UP!</div>
        <div class="lvl-tier-title" id="modal-lvl-title">Shortcut Learner</div>
        <button class="btn-primary" id="btn-close-level-modal">Claim Rank & Continue</button>
      </div>
    </div>

    <!-- Fullscreen Gaming Auth Portal Overlay (Login / Signup Gate) -->
    <div id="auth-portal-overlay" class="auth-portal-overlay hidden" role="dialog" aria-modal="true">
      <div class="auth-terminal-card">
        <button type="button" class="auth-close-btn" id="btn-close-auth-portal" title="Close" aria-label="Close Auth Modal">✕</button>
        <div class="auth-card-header">
          <div class="auth-brand-emblem">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
          <h2>SHORTCUT <span>MASTER</span></h2>
          <p>Sign in or create an operator profile to preserve your XP, mastery ranks, streak, and achievements.</p>
        </div>

        <!-- Auth Navigation Tabs -->
        <div class="auth-tabs-row">
          <button type="button" class="auth-tab-btn active" id="tab-btn-login">LOG IN</button>
          <button type="button" class="auth-tab-btn" id="tab-btn-signup">SIGN UP</button>
        </div>

        <!-- Error / Feedback Alert Box -->
        <div id="auth-alert-box" class="auth-alert-box"></div>

        <!-- Log In Form -->
        <form id="form-auth-login" class="auth-form">
          <!-- Saved Accounts Fast Select -->
          <div class="saved-profiles-section" id="saved-profiles-wrapper" style="display: none;">
            <span class="saved-profiles-label">Saved Operators:</span>
            <div class="saved-profiles-chips" id="saved-profiles-list"></div>
          </div>

          <div class="auth-input-group">
            <label for="login-username">Operator Username</label>
            <input type="text" id="login-username" class="auth-input-field" placeholder="Enter username" autocomplete="username" required />
          </div>

          <div class="auth-input-group">
            <label for="login-password">Security Password</label>
            <input type="password" id="login-password" class="auth-input-field" placeholder="Enter password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn-primary auth-submit-btn" id="btn-submit-login">AUTHENTICATE & ENTER</button>
        </form>

        <!-- Sign Up Form -->
        <form id="form-auth-signup" class="auth-form hidden">
          <div class="auth-input-group">
            <label for="signup-username">Choose Operator Name</label>
            <input type="text" id="signup-username" class="auth-input-field" placeholder="e.g. CyberPro (2-20 chars)" autocomplete="username" required maxlength="20" />
          </div>

          <div class="auth-input-group">
            <label for="signup-password">Create Password</label>
            <input type="password" id="signup-password" class="auth-input-field" placeholder="Min 4 characters" autocomplete="new-password" required minlength="4" />
          </div>

          <div class="auth-input-group">
            <label>Select Avatar Crest</label>
            <div class="avatar-picker-grid" id="avatar-picker-grid">
              <!-- Rendered dynamically by app.js -->
            </div>
          </div>

          <button type="submit" class="btn-primary auth-submit-btn" id="btn-submit-signup">INITIALIZE ACCOUNT & PLAY</button>
        </form>

        <div class="auth-footer-divider">OR</div>

        <button type="button" class="btn-guest-play" id="btn-guest-play">Play Offline as Guest (Progress Not Saved)</button>
      </div>
    </div>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
